name: Daily YouTube Script Generator

on:
  schedule:
    # 毎日日本時間 午前7時 = UTC 22:00（前日）
    - cron: "0 22 * * *"
  workflow_dispatch:
    # 手動実行も可能

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Gmail API 認証ファイルを作成
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: テーマ履歴を復元
        run: |
          mkdir -p data
          if [ -n "${{ secrets.TOPIC_HISTORY_JSON }}" ]; then
            echo '${{ secrets.TOPIC_HISTORY_JSON }}' > data/topic_history.json
          fi
          if [ -n "${{ secrets.SENT_LOG_JSON }}" ]; then
            echo '${{ secrets.SENT_LOG_JSON }}' > data/sent_log.json
          fi

      - name: 台本生成 & メール送信
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_METHOD: gmail_api
        run: python main.py

      - name: テーマ履歴をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: data/
          retention-days: 90
